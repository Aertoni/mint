on: [push, pull_request]
name: Run checks

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev gcc-mingw-w64

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu, x86_64-pc-windows-gnu
          components: clippy, rustfmt

      - name: Get versions
        run: |
          cargo fmt --version
          cargo clippy --version

      - name: Check clippy
        run: cargo clippy --locked --all-features --all-targets -- -D warnings

      - name: Check rustfmt
        run: cargo fmt -- --check

      - name: Run tests
        run: cargo test --locked --all-features --all-targets

      - name: Build Linux release workspace
        run: cargo build --locked --profile dist --workspace --target x86_64-unknown-linux-gnu
